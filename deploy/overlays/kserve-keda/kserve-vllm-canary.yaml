    serving.kserve.io/autoscalerClass: "keda"
    aiops.k8s.io/validation-status: "schema-and-policy-validated"
    aiops.k8s.io/hardware-requirement: "nvidia-gpu-nodes"
spec:
  predictor:
    minReplicas: 1       # Canary test baseline
    maxReplicas: 4
    scaleTarget: 10
    scaleMetric: concurrency
    autoScaling:
