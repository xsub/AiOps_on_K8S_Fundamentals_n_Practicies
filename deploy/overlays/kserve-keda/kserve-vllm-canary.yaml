        ports:
          - name: http1
            containerPort: 8000
            protocol: TCP
        startupProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 45
          periodSeconds: 10
          failureThreshold: 30
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 20
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          periodSeconds: 15
        resources:
          requests:
            cpu: "32"
            memory: "160Gi"
            nvidia.com/gpu: "2"
          limits:
            cpu: "32"
            memory: "160Gi"
            nvidia.com/gpu: "2"
        securityContext:
          runAsNonRoot: true
