# vLLM KServe InferenceService with Gateway API Canary Routing — Validated Reference Specification
# Implements Section 4: Explicit KV-Cache Tuning (--gpu-memory-utilization, --max-model-len),
# Warm Minimum Replicas, KEDA autoscaling, and 90/10 Canary Routing via Gateway API HTTPRoute.
apiVersion: serving.kserve.io/v1beta1
kind: InferenceService
metadata:
  name: llama3-70b-stable
  namespace: ai-inference
  labels:
    app.kubernetes.io/name: llama3-70b-inference
    app.kubernetes.io/part-of: aiops-inference-serving
    app.kubernetes.io/version: stable
  annotations:
    serving.kserve.io/deploymentMode: "RawDeployment"
    serving.kserve.io/autoscalerClass: "keda"
    aiops.k8s.io/validation-status: "schema-and-policy-validated"
    aiops.k8s.io/hardware-requirement: "nvidia-gpu-nodes"
spec:
  predictor:
    minReplicas: 2       # HA baseline; avoids catastrophic 120s cold start
    maxReplicas: 6
    scaleTarget: 10
    scaleMetric: concurrency
    autoScaling:
      metrics:
        - type: External
          external:
            metric:
              backend: prometheus
              serverAddress: "http://prometheus-operated.monitoring.svc:9090"
              query: 'sum(vllm:num_requests_waiting{model_name="llama-3.1-70b-instruct"})'
            target:
              type: AverageValue
              averageValue: "5"
    runtimeClassName: nvidia
    nodeSelector:
      nvidia.com/gpu.product: "NVIDIA-H100-80GB-HBM3"
    containers:
      - name: kserve-container
        image: vllm/vllm-openai:v0.33.0@sha256:d825baf9ce4b1b6bfc5ecc7b79880c7e6748c65a72d697ce3d47607aafa84c6e
        command: ["python3", "-m", "vllm.entrypoints.openai.api_server"]
        args:
          - "--model=/models/Meta-Llama-3.1-70B-Instruct-FP8"
          - "--served-model-name=llama-3.1-70b-instruct"
          - "--tensor-parallel-size=2"
          - "--quantization=fp8"
          - "--kv-cache-dtype=fp8"
          - "--gpu-memory-utilization=0.90"
          - "--max-model-len=16384"
          - "--max-num-seqs=128"
          - "--enable-prefix-caching"
          - "--api-key=$(VLLM_API_KEY)"
        env:
          - name: VLLM_API_KEY
            valueFrom:
              secretKeyRef:
                name: vllm-api-auth
                key: api-key
        ports:
          - name: http1
            containerPort: 8000
            protocol: TCP
        startupProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 45
          periodSeconds: 10
          failureThreshold: 30
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 20
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          periodSeconds: 15
        resources:
          requests:
            cpu: "32"
            memory: "160Gi"
            nvidia.com/gpu: "2"
          limits:
            cpu: "32"
            memory: "160Gi"
            nvidia.com/gpu: "2"
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          runAsGroup: 1000
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
            add: ["IPC_LOCK"]
          seccompProfile:
            type: RuntimeDefault
        volumeMounts:
          - name: model-cache
            mountPath: /models
            readOnly: true
          - name: dshm
            mountPath: /dev/shm
    volumes:
      - name: model-cache
        persistentVolumeClaim:
          claimName: llm-weights-nvme-rwx
      - name: dshm
        emptyDir:
          medium: Memory
          sizeLimit: 32Gi
---
apiVersion: serving.kserve.io/v1beta1
