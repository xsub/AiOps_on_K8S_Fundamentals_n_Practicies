          seccompProfile:
            type: RuntimeDefault
        volumeMounts:
          - name: model-cache
            mountPath: /models
            readOnly: true
          - name: dshm
            mountPath: /dev/shm
    volumes:
      - name: model-cache
        persistentVolumeClaim:
          claimName: llm-weights-nvme-rwx
      - name: dshm
        emptyDir:
          medium: Memory
          sizeLimit: 32Gi
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: llama3-70b-canary-route
  namespace: ai-inference
  labels:
    app.kubernetes.io/name: llama3-70b-inference
    app.kubernetes.io/part-of: aiops-inference-serving
  annotations:
    aiops.k8s.io/validation-status: "schema-and-policy-validated"
    aiops.k8s.io/hardware-requirement: "portable-control-plane"
spec:
  parentRefs:
    - name: ai-inference-gateway
      namespace: ai-inference
      sectionName: http
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /v1
      backendRefs:
        - name: llama3-70b-stable-predictor
          port: 80
          weight: 90
        - name: llama3-70b-canary-predictor
          port: 80
          weight: 10
