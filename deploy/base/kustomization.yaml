apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Base Layer for AI Inference Deployments
# Declares tenant namespace, restricted PodSecurity standards, least-privilege RBAC,
# strict default-deny NetworkPolicies, PDB, NVMe model cache PVC, and API Secret placeholder.

resources:
  - namespace.yaml
  - rbac.yaml
  - networkpolicy.yaml
  - pdb.yaml
  - pvc-model-cache.yaml
  - secret-api-auth.example.yaml
