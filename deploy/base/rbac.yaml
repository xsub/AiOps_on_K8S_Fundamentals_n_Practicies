    aiops.k8s.io/hardware-requirement: "portable-control-plane"
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: vllm-inference-role
  namespace: ai-inference
