apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: vllm-inference-rb
  namespace: ai-inference
  labels:
    app.kubernetes.io/name: vllm-inference
    app.kubernetes.io/part-of: aiops-inference
