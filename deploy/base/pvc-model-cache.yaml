apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: llm-weights-nvme-rwx
  namespace: ai-inference
  labels:
    app.kubernetes.io/name: llm-weights-cache
    app.kubernetes.io/part-of: aiops-inference
  annotations:
    aiops.k8s.io/validation-status: "schema-and-policy-validated"
    aiops.k8s.io/hardware-requirement: "nvidia-gpu-nodes"
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: nvme-raid0-rwx
  resources:
    requests:
      storage: 1Ti
