# Namespace, Least-Privilege RBAC, and API Authentication Secret
apiVersion: v1
kind: Namespace
metadata:
  name: ai-inference
  labels:
    app.kubernetes.io/part-of: aiops-reference-impl
    aiops.k8s.io/guardrails: "enabled"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: inference-engine-sa
  namespace: ai-inference
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: aiops-controller-sa
  namespace: ai-inference
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: aiops-controller-readonly-and-events
  namespace: ai-inference
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["policy"]
    resources: ["poddisruptionbudgets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch", "get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: aiops-controller-binding
  namespace: ai-inference
subjects:
  - kind: ServiceAccount
    name: aiops-controller-sa
    namespace: ai-inference
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: aiops-controller-readonly-and-events
---
apiVersion: v1
kind: Secret
metadata:
  name: vllm-api-auth
  namespace: ai-inference
type: Opaque
stringData:
  api-key: "REF_IMPL_DEMO_AUTH_PLACEHOLDER" # gitleaks:allow
