# Live Closed-Loop AIOps Controller Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aiops-controller
  namespace: ai-inference
  labels:
    app.kubernetes.io/name: aiops-controller
    app.kubernetes.io/part-of: aiops-reference-impl
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: aiops-controller
  template:
    metadata:
      labels:
        app.kubernetes.io/name: aiops-controller
        aiops.k8s.io/role: "aiops-controller"
    spec:
      serviceAccountName: aiops-controller-sa
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: aiops-controller
          image: aiops-ref-runtime:v1.0.0
          imagePullPolicy: Never
          command: ["python3", "-m", "ref_app.k8s_aiops_agent"]
          args:
            - "--metrics-url=http://inference-engine.ai-inference.svc.cluster.local:8000/metrics"
            - "--namespace=ai-inference"
            - "--pdb-name=inference-pdb"
            - "--poll-seconds=10"
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "250m"
              memory: "192Mi"
