# Zero-Trust NetworkPolicy and PodDisruptionBudget for Live Closed-Loop Remediation Gating
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: ai-inference
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-inference-http-and-telemetry
  namespace: ai-inference
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: inference-engine
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - protocol: TCP
          port: 8000
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: inference-pdb
  namespace: ai-inference
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: inference-engine
