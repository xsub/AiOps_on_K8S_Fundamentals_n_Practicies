---
extends: default

rules:
  indentation:
    spaces: 2
    indent-sequences: true
    check-multi-line-strings: false

  line-length:
    max: 180
    level: warning
    allow-non-breakable-words: true
    allow-non-breakable-inline-mappings: true

  truthy:
    level: error
    check-keys: false

  comments:
    level: warning
    min-spaces-from-content: 1

  document-start: disable

  empty-lines:
    max: 2
    max-start: 0
    max-end: 1

  braces:
    max-spaces-inside: 1
    level: warning

  brackets:
    max-spaces-inside: 1
    level: warning

  colons:
    max-spaces-after: 1
    level: warning

  octal-values:
    forbid-implicit-octal: true
    forbid-explicit-octal: true

ignore: |
  .git/
