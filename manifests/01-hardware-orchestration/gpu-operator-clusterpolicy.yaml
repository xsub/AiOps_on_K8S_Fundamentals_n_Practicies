# NVIDIA GPU Operator ClusterPolicy — Validated Reference Specification
# Implements Section 1: Decoupled Drivers, Default nvidia RuntimeClass, MIG Mixed Strategy, and DCGM Telemetry
apiVersion: nvidia.com/v1
kind: ClusterPolicy
metadata:
  name: cluster-policy
  annotations:
    aiops.k8s.io/validation-status: "schema-and-policy-validated"
    aiops.k8s.io/hardware-requirement: "nvidia-gpu-nodes"
spec:
  operator:
    defaultRuntime: containerd
    use_ocp_driver_toolkit: false
    initContainer: {}
  daemonsets:
    updateStrategy: RollingUpdate
    rollingUpdate:
      maxUnavailable: "1"
  driver:
    enabled: true
    usePrecompiled: true
    repository: nvcr.io/nvidia
    image: driver
    version: "570"  # Supported branch string; GPU Operator appends host kernel version automatically
    rdma:
      enabled: true
      useHostMofed: false
    upgradePolicy:
      autoUpgrade: true
      maxParallelUpgrades: 1
      podDeletion:
        force: false
        timeoutSeconds: 300
      waitForCompletion:
        timeoutSeconds: 600
  # Note: usePrecompiled: true does NOT support GPUDirect Storage (GDS/nvidia-fs requires DKMS or host drivers)
  gds:
    enabled: false
  toolkit:
    enabled: true
    installDir: /usr/local/nvidia
  devicePlugin:
    enabled: true
    config:
      name: gpu-sharing-configs
      default: "default"
  mig:
    strategy: mixed
  migManager:
    enabled: true
    config:
      name: custom-mig-parted-configs
      # Default stays "all-disabled" so non-MIG SKUs (e.g. L40S) remain unaffected;
      # opt nodes into profiles via label: nvidia.com/mig.config=all-balanced
      default: "all-disabled"
  dcgm:
    enabled: true
  dcgmExporter:
    enabled: true
    serviceMonitor:
      enabled: true
      interval: 15s
      honorLabels: true  # Preserves native pod, namespace, container labels instead of exported_pod
    config:
      name: dcgm-metrics-config
  gfd:
    enabled: true
  nodeStatusExporter:
    enabled: true
  validator:
    plugin:
      env:
        - name: WITH_WORKLOAD
          value: "false"
