# Kubernetes Dynamic Resource Allocation (DRA resource.k8s.io/v1beta1)
# Demonstrates DeviceClass, ResourceClaimTemplate, CEL Selector filtering, and CDI injection for NVIDIA GPUs
apiVersion: resource.k8s.io/v1beta1
kind: DeviceClass
metadata:
  name: gpu.nvidia.com
  annotations:
    aiops.k8s.io/validation-status: "schema-and-policy-validated"
    aiops.k8s.io/hardware-requirement: "portable-control-plane"
spec:
  selectors:
    - cel:
        expression: "device.driver == 'gpu.nvidia.com'"
---
apiVersion: resource.k8s.io/v1beta1
kind: ResourceClaimTemplate
metadata:
  name: h100-gpu-claim-template
  namespace: ai-inference
  annotations:
    aiops.k8s.io/validation-status: "schema-and-policy-validated"
    aiops.k8s.io/hardware-requirement: "nvidia-gpu-nodes"
spec:
  spec:
    devices:
      requests:
        - name: req-gpu-primary
          deviceClassName: gpu.nvidia.com
          allocationMode: ExactCount
          count: 1
          selectors:
            - cel:
                expression: "device.attributes['gpu.nvidia.com'].model.matches('H100.*')"
---
apiVersion: v1
kind: Pod
metadata:
  name: vllm-dra-inference
  namespace: ai-inference
  annotations:
    aiops.k8s.io/validation-status: "schema-and-policy-validated"
    aiops.k8s.io/hardware-requirement: "nvidia-gpu-nodes"
spec:
  restartPolicy: Never
  runtimeClassName: nvidia
  resourceClaims:
    - name: gpu-claim
      resourceClaimTemplateName: h100-gpu-claim-template
  containers:
    - name: vllm-inference
      image: vllm/vllm-openai:v0.33.0@sha256:d825baf9ce4b1b6bfc5ecc7b79880c7e6748c65a72d697ce3d47607aafa84c6e
      command: ["python3", "-m", "vllm.entrypoints.openai.api_server"]
      args:
        - "--model=meta-llama/Meta-Llama-3.1-8B-Instruct"
        - "--gpu-memory-utilization=0.90"
        - "--max-model-len=8192"
        - "--api-key=$(VLLM_API_KEY)"
      env:
        - name: VLLM_API_KEY
          valueFrom:
            secretKeyRef:
              name: vllm-api-auth
              key: api-key
      resources:
        claims:
          - name: gpu-claim
        limits:
          cpu: "16"
          memory: "64Gi"
        requests:
          cpu: "16"
          memory: "64Gi"
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
          add: ["IPC_LOCK"]
        seccompProfile:
          type: RuntimeDefault
      volumeMounts:
        - name: dshm
          mountPath: /dev/shm
  volumes:
    - name: dshm
      emptyDir:
        medium: Memory
        sizeLimit: 16Gi
