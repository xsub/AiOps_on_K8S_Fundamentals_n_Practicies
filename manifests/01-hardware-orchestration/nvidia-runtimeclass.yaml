# NVIDIA Container RuntimeClass — Validated Reference Specification
apiVersion: node.k8s.io/v1
kind: RuntimeClass
metadata:
  name: nvidia
  annotations:
    aiops.k8s.io/validation-status: "schema-and-policy-validated"
    aiops.k8s.io/hardware-requirement: "portable-control-plane"
    aiops.k8s.io/scheduling-alternatives: "Run:ai (KAI), SIGs Kueue, and Volcano are mutually exclusive scheduler options; deploy only one engine per cluster"
handler: nvidia
scheduling:
  nodeSelector:
    nvidia.com/gpu.present: "true"
  tolerations:
    - key: nvidia.com/gpu
      operator: Exists
      effect: NoSchedule

