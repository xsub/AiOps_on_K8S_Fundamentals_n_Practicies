# Explicit NVIDIA RuntimeClass & ResourceQuota Example
apiVersion: node.k8s.io/v1
kind: RuntimeClass
metadata:
  name: nvidia
handler: nvidia
scheduling:
  nodeSelector:
    nvidia.com/gpu.present: "true"
  tolerations:
    - key: nvidia.com/gpu
      operator: Exists
      effect: NoSchedule
---
# Run:ai / KAI Scheduler Hierarchical Fair-Share Queue Configuration
apiVersion: scheduling.run.ai/v2
kind: Queue
metadata:
  name: llm-inference-prod
spec:
  parentQueue: ai-platform
  priority: 100
  resources:
    gpu:
      quota: 16          # Guaranteed baseline GPUs (nominal quota)
      limit: 24          # Can borrow up to 8 idle GPUs from other queues
      overQuotaWeight: 2
    cpu:
      quota: 128
      limit: 256
    memory:
      quota: 1024Gi
      limit: 2048Gi
---
apiVersion: scheduling.run.ai/v2
kind: Queue
metadata:
  name: ml-research-batch
spec:
  parentQueue: ai-platform
  priority: 50
  resources:
    gpu:
      quota: 8
      limit: 24          # Burstable when inference is below max limit
      overQuotaWeight: 1
