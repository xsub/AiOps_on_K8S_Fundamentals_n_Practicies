# Production DCGM Exporter Metrics Collector Configuration
# ConfigMap referenced by NVIDIA GPU Operator ClusterPolicy dcgmExporter.config.name
# Includes standard framebuffer/power/temp/XID telemetry and DCP profiling counters
apiVersion: v1
kind: ConfigMap
metadata:
  name: dcgm-metrics-config
  namespace: gpu-operator
  labels:
    app.kubernetes.io/name: dcgm-exporter
    app.kubernetes.io/part-of: nvidia-gpu-operator
data:
  dcgm-metrics.csv: |
    # Format: FieldID, MetricName, MetricType, Description
    # -----------------------------------------------------------------------------------------
    # Standard Framebuffer, Power, Temperature, and XID Telemetry
    DCGM_FI_DEV_FB_FREE, DCGM_FI_DEV_FB_FREE, gauge, Framebuffer memory free in MiB.
    DCGM_FI_DEV_FB_USED, DCGM_FI_DEV_FB_USED, gauge, Framebuffer memory used in MiB.
    DCGM_FI_DEV_XID_ERRORS, DCGM_FI_DEV_XID_ERRORS, gauge, Value of the last XID error detected.
    DCGM_FI_DEV_POWER_USAGE, DCGM_FI_DEV_POWER_USAGE, gauge, Power usage for the device in Watts.
    DCGM_FI_DEV_GPU_TEMP, DCGM_FI_DEV_GPU_TEMP, gauge, Current GPU temperature in degrees Celsius.
    DCGM_FI_DEV_THERMAL_VIOLATION, DCGM_FI_DEV_THERMAL_VIOLATION, counter, Total thermal throttling violation time in microseconds.

    # Dynamic Core Profiling (DCP) Hardware Counters (Requires Hopper/Ada/Ampere profiling permissions)
    DCGM_FI_PROF_GR_ENGINE_ACTIVE, DCGM_FI_PROF_GR_ENGINE_ACTIVE, gauge, Ratio of time the graphics engine is active (0.0 to 1.0).
    DCGM_FI_PROF_SM_ACTIVE, DCGM_FI_PROF_SM_ACTIVE, gauge, Ratio of cycles with at least one active warp on any SM (0.0 to 1.0).
    DCGM_FI_PROF_SM_OCCUPANCY, DCGM_FI_PROF_SM_OCCUPANCY, gauge, Ratio of resident warps to theoretical maximum warps (0.0 to 1.0).
    DCGM_FI_PROF_PIPE_TENSOR_ACTIVE, DCGM_FI_PROF_PIPE_TENSOR_ACTIVE, gauge, Ratio of cycles Tensor Core pipelines were active executing GEMM instructions.
    DCGM_FI_PROF_DRAM_ACTIVE, DCGM_FI_PROF_DRAM_ACTIVE, gauge, Ratio of cycles memory controller was active accessing HBM/DRAM bandwidth.

    # Interconnect Profiling Counters (NVLink and PCIe Bus Telemetry)
    DCGM_FI_PROF_NVLINK_TX_BYTES, DCGM_FI_PROF_NVLINK_TX_BYTES, counter, Total bytes transmitted across all active NVLink links.
    DCGM_FI_PROF_NVLINK_RX_BYTES, DCGM_FI_PROF_NVLINK_RX_BYTES, counter, Total bytes received across all active NVLink links.
    DCGM_FI_PROF_PCIE_TX_BYTES, DCGM_FI_PROF_PCIE_TX_BYTES, counter, Total bytes transmitted across the PCIe bus.
