# High-Throughput Model Storage & Distributed Caching Architecture — Validated Reference Specification
# Implements Section 6: Fluid Dataset + JindoRuntime with AWS IRSA Workload Identity & KServe OCI Modelcar
apiVersion: v1
kind: ServiceAccount
metadata:
  name: fluid-s3-irsa-sa
  namespace: ai-inference
  annotations:
    eks.amazonaws.com/role-arn: "arn:aws:iam::123456789012:role/fluid-s3-model-reader-role"
    aiops.k8s.io/validation-status: "schema-and-policy-validated"
    aiops.k8s.io/hardware-requirement: "portable-control-plane"
automountServiceAccountToken: true
---
apiVersion: data.fluid.io/v1alpha1
kind: Dataset
metadata:
  name: llama-3-1-70b-weights
  namespace: ai-inference
  annotations:
    aiops.k8s.io/validation-status: "schema-and-policy-validated"
    aiops.k8s.io/hardware-requirement: "portable-control-plane"
spec:
  mounts:
    - mountPoint: "s3://prod-llm-models-us-east-1/Meta-Llama-3.1-70B-Instruct-FP8/"
      name: llama-70b-s3
      options:
        fs.s3a.endpoint: "s3.us-east-1.amazonaws.com"
        fs.s3a.aws.credentials.provider: "com.amazonaws.auth.WebIdentityTokenCredentialsProvider"
  accessModes:
    - ReadOnlyMany
---
apiVersion: data.fluid.io/v1alpha1
kind: JindoRuntime
metadata:
  name: llama-3-1-70b-weights
  namespace: ai-inference
  annotations:
    aiops.k8s.io/validation-status: "schema-and-policy-validated"
    aiops.k8s.io/hardware-requirement: "nvidia-gpu-nodes"
spec:
  replicas: 4
  tieredstore:
    levels:
      - mediumtype: MEM
        path: /dev/shm
        quota: 32Gi
        high: "0.9"
        low: "0.7"
      - mediumtype: SSD
        path: /mnt/nvme-raid0/fluid-cache
        quota: 500Gi
        high: "0.95"
        low: "0.8"
  master:
    serviceAccount: fluid-s3-irsa-sa
    podMetadata:
      annotations:
        eks.amazonaws.com/role-arn: "arn:aws:iam::123456789012:role/fluid-s3-model-reader-role"
  worker:
    serviceAccount: fluid-s3-irsa-sa
    podMetadata:
      annotations:
        eks.amazonaws.com/role-arn: "arn:aws:iam::123456789012:role/fluid-s3-model-reader-role"
    nodeSelector:
      node.kubernetes.io/instance-type: "p5.48xlarge"
---
# Alternative Fast Cold-Start Pattern: KServe v0.14+ OCI Modelcar Volume Mount (Local Container Layer Mount)
apiVersion: serving.kserve.io/v1beta1
kind: InferenceService
metadata:
  name: llama3-70b-modelcar-sample
  namespace: ai-inference
  annotations:
    aiops.k8s.io/validation-status: "schema-and-policy-validated"
    aiops.k8s.io/hardware-requirement: "nvidia-gpu-nodes"
spec:
  predictor:
    model:
      modelFormat:
        name: vLLM
      storageUri: "oci://ghcr.io/my-org/models/llama-3.1-70b-instruct-fp8:v1.0"
      resources:
        limits:
          cpu: "16"
          memory: "128Gi"
          nvidia.com/gpu: "2"
        requests:
          cpu: "16"
          memory: "128Gi"
          nvidia.com/gpu: "2"
